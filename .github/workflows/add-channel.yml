name: 채널 추가

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '채널 URL 또는 @핸들 (예: @내핸들)'
        required: true
        type: string
      color:
        description: '대시보드 색상'
        required: false
        default: '#6366f1'
        type: choice
        options:
          - '#6366f1'
          - '#ec4899'
          - '#14b8a6'
          - '#f59e0b'
          - '#ef4444'
          - '#22c55e'

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 채널 등록 + 과거 영상 수집
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CHANNEL_COLOR: ${{ inputs.color }}
          CHANNEL_INPUT: ${{ inputs.channel }}
        run: node scripts/collect.mjs

      - name: 변경분 커밋
        env:
          CHANNEL_INPUT: ${{ inputs.channel }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels.json data/
          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "➕ 채널 추가: $CHANNEL_INPUT"
            git push
          fi
